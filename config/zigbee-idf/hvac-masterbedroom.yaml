# ESP-IDF + midea_xye_zigbee — master bedroom (work in progress)
#
# Requires ESPHome 2026.x with ESP-IDF on ESP32-C6.
# Flash via USB first; OTA once WiFi is stable.
#
# Component path: local checkout of this repo (adjust if you use git source).

substitutions:
  name: "hvac-masterbedroom-idf"
  friendly_name: "Master Bedroom HVAC (IDF)"
  comment: "ESP32-C6 ESP-IDF — midea_xye_zigbee RS-485 bridge"
  room_id: "masterbedroom"
  ip_address: "10.0.20.163"
  follow_me_entity: "sensor.zigbee_temp_masterbedroom_temperature"
  climate_name: "hvac-masterbedroom-idf"
  climate_name_id: "hvac_masterbedroom_idf"
  temp_min: "20"
  temp_max: "26"
  wifi_gateway: "10.0.20.1"
  wifi_subnet: "255.255.255.0"
  uart_tx: "GPIO4"
  uart_rx: "GPIO5"
  unit_id: "0x00"
  master_id: "0x00"
  midea_xye_log: "DEBUG"

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  comment: ${comment}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  baud_rate: 0
  logs:
    midea_xye: ${midea_xye_log}

api:
  reboot_timeout: 0s
  encryption:
    key: !secret hvac_master__encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: ${ip_address}
  power_save_mode: NONE
  manual_ip:
    static_ip: ${ip_address}
    gateway: ${wifi_gateway}
    subnet: ${wifi_subnet}
  ap:
    ssid: "hvac-${room_id}-setup"
    password: !secret access_point_password

captive_portal:

external_components:
  - source:
      type: local
      path: ../../esphome/components
    components: [midea_xye_zigbee]

uart:
  tx_pin: ${uart_tx}
  rx_pin: ${uart_rx}
  baud_rate: 4800

sensor:
  - platform: homeassistant
    id: ${room_id}_follow_me
    entity_id: ${follow_me_entity}
    name: "${friendly_name} Follow-Me"

  - platform: wifi_signal
    name: "${friendly_name} Wi-Fi Signal"
    update_interval: 60s
    entity_category: DIAGNOSTIC

  - platform: uptime
    name: "Uptime"
    id: uptime_sec
    internal: true

climate:
  - platform: midea_xye_zigbee
    name: ${climate_name}
    id: ${climate_name_id}
    unit_id: ${unit_id}
    master_id: ${master_id}
    period: 1s
    timeout: 100ms
    use_fahrenheit: false
    beeper: true
    compressor_aware_action: true
    sync_fan_mode_from_device: false
    sync_fan_mode_from_c0: true
    visual:
      min_temperature: ${temp_min} °C
      max_temperature: ${temp_max} °C
      temperature_step: 1.0 °C
    supported_modes:
      - FAN_ONLY
      - HEAT_COOL
      - COOL
      - HEAT
      - DRY
    follow_me_sensor: ${room_id}_follow_me
    compressor_active:
      name: "C0 Compressor Run Flag"

